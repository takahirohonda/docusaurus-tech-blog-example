# https://github.com/marketplace/actions/transfer-files-in-repository-to-remote-server-via-scp
name: Deploy
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: |
          yarn install
      - name: Build Docusaurus
        run: |
          yarn build
          pwd
      - name: Deploy to Github page
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          ACCESS_TOKEN: ${{ secrets.TK_BLOG_DEPLOY  }}
          BRANCH: master # The branch the action should deploy to.
          FOLDER: build # The folder the action should deploy.
          REPOSITORY_NAME: takahirohonda/takahirohonda.github.io
          TARGET_FOLDER: mydatahack-old-blog
